server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: pn-api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: pn-identity-actuator-health
              uri: ${IDENTITY_SERVICE_URL:http://localhost:9001}
              predicates:
                - Path=/actuator/identity/**
              filters:
                - StripPrefix=2
                - PrefixPath=/actuator

            - id: pn-hrm-actuator-health
              uri: ${HRM_SERVICE_URL:http://localhost:9002}
              predicates:
                - Path=/actuator/hrm/**
              filters:
                - StripPrefix=2
                - PrefixPath=/actuator

            - id: pn-hrm-api
              uri: ${HRM_SERVICE_URL:http://localhost:9002}
              predicates:
                - Path=/api/v1/hrm/**

            - id: pn-hrm-banks-api
              uri: ${HRM_SERVICE_URL:http://localhost:9002}
              predicates:
                - Path=/api/v1/banks/**

            - id: pn-identity-all-api
              uri: ${IDENTITY_SERVICE_URL:http://localhost:9001}
              predicates:
                - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
