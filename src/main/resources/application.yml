server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: pn-api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: pn-identity-auth
              uri: ${IDENTITY_SERVICE_URL:http://localhost:9001}
              predicates:
                - Path=/api/v1/auth/**

            - id: pn-identity-users
              uri: ${IDENTITY_SERVICE_URL:http://localhost:9001}
              predicates:
                - Path=/api/v1/users/**

            - id: pn-identity-companies
              uri: ${IDENTITY_SERVICE_URL:http://localhost:9001}
              predicates:
                - Path=/api/v1/companies/**

            - id: pn-identity-prefixed
              uri: ${IDENTITY_SERVICE_URL:http://localhost:9001}
              predicates:
                - Path=/api/v1/identity/**
              filters:
                - StripPrefix=2
                - PrefixPath=/api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
